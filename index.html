<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CozyTD</title>
    <link rel="stylesheet" href="TemplateData/style.css?v=c5d6e77726536eb7">
  </head>
  <body>
    <div id="unity-container">
      <div id="cozytd-safe-area-probe" aria-hidden="true"></div>
      <canvas id="unity-canvas" width=960 height=600 tabindex="0"></canvas>
      <div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.__cozytdViewportState = {
        revision: 0,
        renderWidth: 0,
        renderHeight: 0,
        pixelScale: Math.max(1, window.devicePixelRatio || 1),
        left: 0,
        right: 0,
        top: 0,
        bottom: 0
      };

      (function () {
        var resizeSettleDelayMs = 150;
        var canvas = document.getElementById("unity-canvas");
        var probe = document.getElementById("cozytd-safe-area-probe");
        var state = window.__cozytdViewportState;
        var resizeTimer = 0;

        function number(value) {
          var parsed = parseFloat(value);
          return isFinite(parsed) ? Math.max(0, parsed) : 0;
        }

        function refreshViewportState() {
          var canvasRect = canvas.getBoundingClientRect();
          var style = getComputedStyle(probe);
          var viewport = window.visualViewport;
          var visibleLeft = viewport ? viewport.offsetLeft : 0;
          var visibleTop = viewport ? viewport.offsetTop : 0;
          var visibleRight = viewport ? visibleLeft + viewport.width : window.innerWidth;
          var visibleBottom = viewport ? visibleTop + viewport.height : window.innerHeight;
          var cssLeft = Math.max(canvasRect.left, visibleLeft);
          var cssTop = Math.max(canvasRect.top, visibleTop);
          var cssRight = Math.min(canvasRect.right, visibleRight);
          var cssBottom = Math.min(canvasRect.bottom, visibleBottom);
          var safeLeft = number(style.paddingLeft);
          var safeRight = number(style.paddingRight);
          var safeTop = number(style.paddingTop);
          var safeBottom = number(style.paddingBottom);
          var canvasWidth = Math.max(1, canvasRect.width);
          var canvasHeight = Math.max(1, canvasRect.height);

          var pixelScale = canvas.width > 0 ? canvas.width / canvasWidth : Math.max(1, window.devicePixelRatio || 1);
          var left = Math.max(0, safeLeft + cssLeft - canvasRect.left);
          var right = Math.max(0, safeRight + canvasRect.right - cssRight);
          var top = Math.max(0, safeTop + cssTop - canvasRect.top);
          var bottom = Math.max(0, safeBottom + canvasRect.bottom - cssBottom);
          if (state.renderWidth === canvas.width &&
              state.renderHeight === canvas.height &&
              Math.abs(state.pixelScale - pixelScale) < 0.001 &&
              Math.abs(state.left - left) < 0.01 &&
              Math.abs(state.right - right) < 0.01 &&
              Math.abs(state.top - top) < 0.01 &&
              Math.abs(state.bottom - bottom) < 0.01) {
            return;
          }

          state.renderWidth = canvas.width;
          state.renderHeight = canvas.height;
          state.pixelScale = pixelScale;
          state.left = left;
          state.right = right;
          state.top = top;
          state.bottom = bottom;
          state.revision++;
        }

        function resizeRenderTarget() {
          var canvasRect = canvas.getBoundingClientRect();
          var pixelRatio = Math.max(1, window.devicePixelRatio || 1);
          var width = Math.max(1, Math.round(canvasRect.width * pixelRatio));
          var height = Math.max(1, Math.round(canvasRect.height * pixelRatio));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
          refreshViewportState();
        }

        function scheduleRenderTargetResize() {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(resizeRenderTarget, resizeSettleDelayMs);
        }

        new ResizeObserver(scheduleRenderTargetResize).observe(canvas);
        window.addEventListener("resize", scheduleRenderTargetResize, { passive: true });
        window.addEventListener("orientationchange", scheduleRenderTargetResize, { passive: true });
        window.addEventListener("fullscreenchange", scheduleRenderTargetResize, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleRenderTargetResize, { passive: true });
          window.visualViewport.addEventListener("scroll", refreshViewportState, { passive: true });
        }
        resizeRenderTarget();
      })();

      var canvas = document.getElementById("unity-canvas");
      var warningBanner = document.getElementById("unity-warning");
      function unityShowBanner(message, type) {
        warningBanner.textContent = message;
        warningBanner.style.display = "block";
        warningBanner.style.background = type === "error" ? "#b3261e" : "#f9ab00";
      }

      var transientRetryDelaysMs = [1000, 2000, 4000];

      function waitForRetry(delayMs) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, delayMs);
        });
      }

      function isRetryableHttpStatus(status) {
        return status === 404 ||
          status === 408 ||
          status === 425 ||
          status === 429 ||
          status === 500 ||
          status === 502 ||
          status === 503 ||
          status === 504;
      }

      function isBuildAssetRequest(input, init) {
        var method = init && init.method;
        if (!method && input && typeof input === "object" && input.method)
          method = input.method;
        method = (method || "GET").toUpperCase();
        if (method !== "GET" && method !== "HEAD")
          return false;

        try {
          var rawUrl = typeof input === "string"
            ? input
            : input && input.url
              ? input.url
              : String(input);
          var requestUrl = new URL(rawUrl, window.location.href);
          var buildRoot = new URL("Build/", window.location.href);
          return requestUrl.origin === buildRoot.origin &&
            requestUrl.pathname.indexOf(buildRoot.pathname) === 0;
        } catch (error) {
          return false;
        }
      }

      function scheduleBuildAssetRetry(nativeFetch, input, init, attempt, error) {
        if (attempt >= transientRetryDelaysMs.length)
          return Promise.reject(error);

        var delayMs = transientRetryDelaysMs[attempt];
        console.warn(
          "Retrying WebGL build asset request in " + delayMs + "ms (attempt " + (attempt + 2) + ").",
          error);
        return waitForRetry(delayMs).then(function () {
          return retryBuildAssetFetch(nativeFetch, input, init, attempt + 1);
        });
      }

      function retryBuildAssetFetch(nativeFetch, input, init, attempt) {
        return nativeFetch(input, init).then(function (response) {
          if (response.ok || response.status === 304)
            return response;

          var error = new Error(
            "WebGL build asset request failed: HTTP " + response.status + " " + response.url);
          if (!isRetryableHttpStatus(response.status))
            throw error;

          return scheduleBuildAssetRetry(nativeFetch, input, init, attempt, error);
        }, function (error) {
          return scheduleBuildAssetRetry(nativeFetch, input, init, attempt, error);
        });
      }

      function installBuildAssetFetchRetry() {
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          if (!isBuildAssetRequest(input, init))
            return nativeFetch(input, init);
          return retryBuildAssetFetch(nativeFetch, input, init, 0);
        };
      }

      installBuildAssetFetchRetry();

      var buildUrl = "Build";
      var assetVersion = "c5d6e77726536eb7";
      var versionQuery = "?v=" + encodeURIComponent(assetVersion);
      var loaderUrl = buildUrl + "/outputs-release.loader.js" + versionQuery;
      var config = {
        dataUrl: buildUrl + "/outputs-release.data.unityweb" + versionQuery,
        frameworkUrl: buildUrl + "/outputs-release.framework.js.unityweb" + versionQuery,
        codeUrl: buildUrl + "/outputs-release.wasm.unityweb" + versionQuery,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "com.dlakek.cozytd",
        productName: "CozyTD",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: false,
        showBanner: unityShowBanner
      };

      document.getElementById("unity-loading-bar").style.display = "block";

      function startUnityLoader(attempt) {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.getElementById("unity-progress-bar-full").style.width = (100 * progress) + "%";
          }).then(function () {
            document.getElementById("unity-loading-bar").style.display = "none";
          }).catch(function (message) {
            unityShowBanner(message, "error");
          });
        };
        script.onerror = function () {
          script.remove();
          if (attempt >= transientRetryDelaysMs.length) {
            unityShowBanner("Failed to load the Unity WebGL loader after retries.", "error");
            return;
          }

          var delayMs = transientRetryDelaysMs[attempt];
          console.warn(
            "Retrying Unity WebGL loader in " + delayMs + "ms (attempt " + (attempt + 2) + ").");
          window.setTimeout(function () {
            startUnityLoader(attempt + 1);
          }, delayMs);
        };
        document.body.appendChild(script);
      }

      startUnityLoader(0);
    </script>
  </body>
</html>
